<!doctype html>
<html><head><meta charset="utf-8"><title>UI policy matrix verify (#1556)</title>
<style>body{margin:0;background:#000} canvas{display:block}</style></head>
<body>
<script type="module">
import { HudManager } from '/src/client/ui/hud-manager.ts'
const params = new URLSearchParams(location.search)
const w = Number(params.get('w') ?? 800), h = Number(params.get('h') ?? 600)
const canvas = document.createElement('canvas')
canvas.width = w; canvas.height = h
canvas.style.width = `${w}px`; canvas.style.height = `${h}px`
document.body.appendChild(canvas)
const hud = new HudManager(canvas)
hud.resize(w, h)
await hud.init('/ui')
const steps = []
// 1. Stash open, then C / T / Q attempts must be refused (D2Client 0x6FB8D538 row 0x19).
hud.toggleLeftPanel('stash')
hud.toggleLeftPanel('char')
hud.toggleRightPanel('skill')
hud.toggleLeftPanel('quest')
steps.push({ step: 'stash+C/T/Q', left: hud.leftPanel, right: hud.rightPanel })
hud.render(performance.now())
window.__shot1 = true
window.__uiPolicyResults = steps
window.__next = () => {
  // 2. Close stash, open waypoint, then I -> waypoint closes (row 0x14 col 1 = 1).
  hud.setLeftPanel('none')
  hud.rightPanel = 'none'; hud.inventory.visible = false
  hud.toggleLeftPanel('waypoint')
  hud.toggleRightPanel('inv')
  hud.toggleLeftPanel('char')
  steps.push({ step: 'wp+I+C', left: hud.leftPanel, right: hud.rightPanel })
  hud.render(performance.now())
  return steps
}
window.__uiPolicyReady = true
</script></body></html>
